<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>月末請求書生成器</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app" class="app">
  <header class="header">
    <div>
      <h1>月末請求書生成器</h1>
      <p>手机录入 → Firebase同步 → 月末一键生成 PDF</p>
    </div>
    <div class="authbar">
      <span id="userLabel" class="muted">未登录</span>
      <button id="logoutBtn" class="btn ghost hidden">退出</button>
    </div>
  </header>

  <div id="configBanner" class="banner warn hidden">
    Firebase 尚未配置。请先编辑 <b>firebase-config.js</b>。
  </div>

  <section id="authCard" class="card auth-card">
    <h2>登录 / 注册</h2>
    <p class="muted">同一账号在手机和电脑登录后，数据自动同步。</p>
    <div class="form-grid">
      <div>
        <label>邮箱</label>
        <input id="emailInput" type="email" autocomplete="email" placeholder="name@example.com">
      </div>
      <div>
        <label>密码</label>
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="至少 6 位">
      </div>
    </div>
    <div class="actions">
      <button id="loginBtn" class="btn primary">登录</button>
      <button id="registerBtn" class="btn">注册新账号</button>
    </div>
    <div id="authStatus" class="status"></div>
  </section>

  <main id="mainApp" class="hidden">
    <nav class="tabs">
      <button class="tab active" data-tab="entry">快速录入</button>
      <button class="tab" data-tab="monthly">月度汇总</button>
      <button class="tab" data-tab="stores">店铺资料</button>
    </nav>

    <section id="tab-entry" class="panel active">
      <div class="grid2">
        <div class="card">
          <h2>快速录入</h2>
          <p class="muted">只需要：店铺、日期、税込金额。</p>
          <div class="field">
            <label>店铺</label>
            <select id="storeSelect"></select>
          </div>
          <div class="row2">
            <div class="field">
              <label>日期</label>
              <input id="dateInput" type="date">
            </div>
            <div class="field">
              <label>税込金额</label>
              <input id="amountInput" type="number" inputmode="numeric" min="1" step="1" placeholder="67488">
            </div>
          </div>
          <div class="actions">
            <button id="saveBtn" class="btn primary">保存</button>
            <button id="saveContinueBtn" class="btn">保存并继续这家店</button>
          </div>
          <div id="saveStatus" class="status"></div>
        </div>

        <div class="card">
          <div class="flex-between">
            <div>
              <h2>当前店铺本月</h2>
              <div id="currentStoreLabel" class="muted">请选择店铺</div>
            </div>
            <div id="currentStoreTotal" class="total">¥0</div>
          </div>
          <div id="currentStoreList" class="mini-list"></div>
        </div>
      </div>

      <div class="card mt">
        <div class="flex-between">
          <div>
            <h2>最近记录</h2>
            <div id="recordCount" class="muted">0 条</div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>店铺</th><th>日期</th><th class="num">税込金额</th><th>操作</th></tr></thead>
            <tbody id="recordsBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="tab-monthly" class="panel">
      <div class="card">
        <div class="flex-between wrap">
          <div>
            <h2>月度汇总</h2>
            <p class="muted">选择月份后，可单店或全部生成 PDF。</p>
          </div>
          <div class="month-controls">
            <div>
              <label>月份</label>
              <input id="monthInput" type="month">
            </div>
            <div>
              <label>請求日</label>
              <input id="invoiceDateInput" type="date">
            </div>
          </div>
        </div>
        <div id="monthlyList" class="monthly-grid"></div>
        <div class="summary-box">
          <div class="muted">本月全部店铺税込合计</div>
          <div id="monthlyGrandTotal" class="total">¥0</div>
        </div>
        <div class="actions">
          <button id="downloadAllBtn" class="btn primary">一键生成本月全部 PDF</button>
        </div>
        <div id="pdfStatus" class="status"></div>
      </div>
    </section>

    <section id="tab-stores" class="panel">
      <div class="card">
        <div class="flex-between wrap">
          <div>
            <h2>店铺资料</h2>
            <p class="muted">地址和电话会显示在請求書左上角。</p>
          </div>
          <button id="addStoreBtn" class="btn primary">＋ 新增店铺</button>
        </div>
        <div id="storeSettings"></div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<div id="pdfRenderRoot" style="position:fixed;left:-99999px;top:0;width:794px;background:#fff"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
